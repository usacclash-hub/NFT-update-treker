<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница владельца подарка</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); text-align: center; padding: 20px; }
        .gift-card { border: 2px solid #0088cc; border-radius: 15px; padding: 15px; margin-top: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>Профиль владельца подарка</h1>
    <div id="user-info">Загрузка данных из Telegram...</div>

    <div class="gift-card">
        <h3>Улучшенный подарок #1234</h3>
        <p>Статус: 🌟 Премиум Апгрейд</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-info').innerHTML = `
                <p>Привет, <b>${user.first_name}</b> (@${user.username || 'нет'})</p>
                <p>Ваш Telegram ID: ${user.id}</p>
            `;
        } else {
            document.getElementById('user-info').innerText = "Открыто вне Telegram";
        }
    </script>
</body>
</html>
